name: Repaired core regression tests
on:
  push:
    branches: [sash-purple-sexaware]
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python provenance/verify_source.py --phylogic-root .
      - run: python -m unittest discover -s tests -v
      - run: python PhylogicNDT.py Cluster --help
      - run: python PhylogicNDT.py Timing --help
      - run: python PhylogicNDT.py LeagueModel --help
      - name: Synthetic SASH/PURPLE to Cluster, Timing and LeagueModel
        run: bash examples/run_demo.sh
